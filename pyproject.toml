[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "procurecheck"
version = "1.0.0"
description = "Public Procurement Document-Completeness Agent: checks a tender submission against a published checklist and reports present, missing, or human-review items with page and quotation evidence."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Mwesigwa Isaac", email = "mwesigwaisaac40@gmail.com"},
    {name = "Bataringaya Bridget", email = "bridgetbataringaya7@gmail.com"},
    {name = "Jonathan Katongole", email = "jonathaninnocentkatongolejr@gmail.com"},
    {name = "Makmot Johnson Kabira", email = "jmakmot51@gmail.com"},
]
keywords = ["procurement", "completeness", "checklist", "ollama"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "pytest>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
procurecheck = "procurecheck.cli:main"

[project.urls]
Homepage = "https://github.com/Bridget-Bataringaya/AI_AGENTIC_CAPSTONE_ASSIGNMENT"
Repository = "https://github.com/Bridget-Bataringaya/AI_AGENTIC_CAPSTONE_ASSIGNMENT"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
